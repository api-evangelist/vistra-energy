name: Vistra Corp
kind: company
description: >-
  Vistra Corp (NYSE: VST) is an Irving, Texas integrated retail electricity and
  power generation company and the largest competitive power generator in the
  United States, operating roughly 41,000-44,000 MW of natural gas, nuclear,
  coal, solar and battery storage capacity alongside a retail business serving
  nearly 5 million residential, commercial and industrial customers across 16
  states and the District of Columbia through TXU Energy, Dynegy, Ambit Energy,
  Energy Harbor, Homefield Energy and U.S. Gas & Electric. Its home market is the
  United States, where it sits on both sides of the competitive value chain, a
  merchant generator selling into ERCOT, PJM, ISO-NE, NYISO, MISO and CAISO, and
  a retail electricity provider (REP) reselling that power to end customers. Its
  API posture is honestly none. No developer portal, no API subdomain and no
  machine-readable contract of any kind was found: developer., developers.,
  docs., api. and data. on vistracorp.com do not resolve; /developers, /api,
  /docs, /data, /openapi.json, /swagger.json and
  /.well-known/openid-configuration all return 404; and TXU Energy's 758-URL
  sitemap contains no developer or API page. The United States has no consumer
  energy data mandate. Green Button is an NAESB/NIST ESPI standard adopted
  voluntarily, and TXU Energy appears on the US Department of Energy's list of
  "Utilities Committed to Implementing Green Button", a 2012-era commitment list
  and not evidence of a live endpoint. The only customer-data surface found is
  Download-My-Data-style export behind the TXU Energy MyAccount login, whose
  interval readings are themselves sourced from Smart Meter Texas, the shared
  ERCOT meter-data platform operated by the transmission and distribution
  utilities (Oncor, CenterPoint, AEP Texas, TNMP) rather than by Vistra. Because
  Vistra is a retailer and generator and not a wires company, the third-party
  interval-data API in its home Texas market belongs to Smart Meter Texas and not
  to Vistra. Vistra likewise publishes no open market or grid data of its own;
  ERCOT, the other ISOs/RTOs and the EIA publish the market data about Vistra's
  fleet. Both sides are therefore closed at the company boundary. Not to be
  confused with Vistra Limited (vistra.com), the unrelated corporate-services and
  fund-administration firm that does run a real API developer portal at
  devportal.vistra.com.
