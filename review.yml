  attempted: true
  found: 0
  paths:
    - /openapi.json
    - /swagger.json
    - /api-docs
    - /.well-known/
    - /.well-known/openid-configuration
  domainsProbed:
    - vistracorp.com
    - txu.com
    - dynegy.com
    - homefieldenergy.com
    - ambitenergy.com
  result: >-
    No OpenAPI, Swagger, AsyncAPI, GraphQL schema, Postman collection or any
    other machine-readable API contract was found on any Vistra-controlled
    domain. The openapi/ directory is intentionally absent from this repository.

