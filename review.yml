aid: vistra-energy
name: Vistra Corp
review:
  question: >-
    Does Vistra Corp publish a public, documented API — consumer energy data
    (Green Button / ESPI or equivalent) or open market/grid data — that a
    developer can reach without a Vistra customer account or a commercial deal?
  answer: false
  date: '2026-07-27'
  reviewer: API Evangelist
  sector: Energy & Utilities
  tier: utility-retailer
  homeMarket: United States

energyDataPosture:
  homeMarket: United States
  organizationRole: >-
    Competitive merchant power generator (approximately 41,000-44,000 MW across
    natural gas, nuclear, coal, solar and battery storage) and retail electricity
    provider (REP) / competitive retail supplier serving nearly 5 million
    customers in 16 states and the District of Columbia. Vistra is NOT a
    regulated wires company. It owns no transmission or distribution network and
    no meters, which is the structural reason the consumer-data API in its home
    Texas market does not belong to it.

  mandateRegime: green-button-voluntary
  mandateRegimeVerbatim: >-
    No consumer energy data right applies to Vistra Corp. The United States has
    no federal energy equivalent of the Australian Consumer Data Right and no
    Ontario-style Green Button regulation binding this company. Green Button is
    an NAESB/NIST-derived open standard (Energy Services Provider Interface,
    ESPI) that utilities and retailers adopt voluntarily. The only obligation-
    adjacent artifact found naming a Vistra entity is the US Department of
    Energy's list headed "Utilities Committed to Implementing Green Button",
    which names TXU Energy (a Vistra retail brand) alongside 35 other entities.
    That is a voluntary 2012-era commitment list, not a rule, and it does not
    compel anything. Texas ERCOT market rules place the smart-meter data
    obligation on the transmission and distribution utilities (Oncor, CenterPoint
    Energy, AEP Texas, TNMP) through the shared Smart Meter Texas platform, not
    on retail electricity providers such as TXU Energy.

  mandateStatus: live-claimed-unverified
  mandateStatusVerbatim: >-
    A commitment exists on paper; an implementation could not be verified.
    energy.gov/data/green-button (HTTP 200, fetched 2026-07-27) names TXU Energy
    under "Utilities Committed to Implementing Green Button". Third-party
    secondary sources describe TXU Energy customers being able to sign in and
    download usage data. But Vistra's and TXU Energy's own live pages do not
    corroborate a Green Button surface: the TXU Energy usage-help pages that
    would carry it — /help/manage-usage/my-energy-dashboard and
    /help/manage-usage/smart-meters (both HTTP 200, fetched 2026-07-27) — make no
    mention of Green Button, ESPI, data download, data export, or third-party
    data sharing at all. The dashboard page instead states that "Current kWh
    information in MyEnergy Dashboard is based on usage provided by the Smart
    Meter Texas Portal. Current usage information will be approximately 48 hours
    old." The full TXU Energy sitemap (https://www.txu.com/sitemap.xml, HTTP 200,
    758 <loc> entries) contains no developer, API, Green Button, or data-export
    page. Per the API Evangelist standard that a commitment list, a press
    release, or a compliance page is not an implementation, this is recorded as
    live-claimed-unverified rather than voluntary-adopted. No Green Button
    Alliance certification for Vistra Corp or TXU Energy was found. No Connect My
    Data (third-party, continuous, consent-driven) surface exists under any
    Vistra domain.

  dataStandard: >-
    Green Button / ESPI (NAESB REQ.21) is claimed by association only, via the US
    DOE commitment list naming TXU Energy. No version is published, no conformance
    statement is published, and no ESPI/Atom endpoint was found. Effectively: no
    standard reference found on any Vistra-controlled property. No CDR Consumer
    Data Standards (not an Australian entity), no OCPP/OCPI, no OpenADR, no IEEE
    2030.5, and no IEC CIM 61968/61970 references were found.

  consumerDataApi: false
  consumerDataVsMarketData:
    consumerData:
      apiAvailable: false
      detail: >-
        No third party can obtain an individual Vistra customer's usage or
        billing data through a documented Vistra API. The only consumer-data
        surface is the TXU Energy MyAccount web application at
        https://services.txu.com/ (HTTP 200, ASP.NET session cookie behind an AWS
        ALB), which renders the MyEnergy Dashboard to the account holder after
        login. It is a customer web portal, not a developer API. Crucially, the
        interval data it displays originates from Smart Meter Texas, the shared
        ERCOT meter-data platform operated by the four Texas TDUs. Smart Meter
        Texas — not Vistra — is where a third party registers to obtain a
        customer's authorized interval data in Texas. Vistra as a REP is a
        consumer of that platform, not a publisher.
    marketData:
      openPublished: false
      detail: >-
        Vistra publishes no open grid, market, dispatch, outage, or generation
        data of its own. It is a price-taking/price-making participant in ERCOT,
        PJM, ISO-NE, NYISO, MISO and CAISO; those ISOs/RTOs, plus the US Energy
        Information Administration (EIA) and FERC, are the bodies that publish
        open data ABOUT Vistra's fleet. Nothing anonymous and machine-readable is
        served from vistracorp.com beyond the WordPress CMS surface noted below.
    theSplit: >-
      This is a rare double-closed case. Many energy organizations are wide open
      on one axis and shut on the other — an ISO publishes market data and no
      consumer data; a mandated retailer publishes consumer data and no market
      data. Vistra publishes neither, because its position in the value chain
      (merchant generator plus retailer, owning no wires and no meters, in a
      country with no consumer energy data right) leaves it with no regulatory
      obligation to publish and no commercial reason to. Both the consumer and
      the market data about Vistra exist and are obtainable — just from third
      parties (Smart Meter Texas, ERCOT, EIA), never from Vistra.

  accessGate: customer-account-required
  accessGateDetail: >-
    There is no developer on-ramp of any kind. A developer cannot sign up, cannot
    apply, and cannot request keys — there is no form, no portal, and no
    published contact for API access. The only way to reach any Vistra energy
    data is to become a retail customer of a Vistra brand and log in at
    https://services.txu.com/ (or the equivalent brand portal) to view your own
    account. To obtain a Texas customer's interval data programmatically, a
    developer must instead register as a third party with Smart Meter Texas and
    obtain that customer's authorization — a route that runs through the TDU-
    operated platform and entirely bypasses Vistra.

  authModel: >-
    None published for developers. The customer portal at services.txu.com uses
    username/password web session authentication (ASP.NET_SessionId cookie plus
    AWS ALB stickiness cookies). No OAuth 2.0, no OpenID Connect, no API keys and
    no mTLS are documented. Anonymous fetch of
    https://www.txu.com/.well-known/openid-configuration returned HTTP 404 and
    https://www.vistracorp.com/.well-known/openid-configuration returned HTTP 404
    on 2026-07-27, so no OIDC discovery document is served on either property.

findings:
  summary: >-
    Vistra Corp has no public API surface. Every developer-shaped subdomain on
    the primary domain fails to resolve, every conventional discovery path 404s,
    and the retail brand with the largest footprint (TXU Energy) has no developer
    page anywhere in its 758-URL sitemap. The single machine-readable thing
    served from vistracorp.com is the WordPress REST API that backs the marketing
    site, which is explicitly disallowed in robots.txt and is CMS infrastructure
    rather than a product API — it is therefore not listed in apis.yml. This is
    the honest US-retailer shape: the standard exists (Green Button), the
    commitment exists (DOE list), the mandate does not, and consequently neither
    does the implementation.
  homonymTrap: >-
    IMPORTANT. Searching "Vistra API" surfaces devportal.vistra.com, titled "API
    Developer Portal" (HTTP 200, 2026-07-27), plus help.vistra.com articles about
    a "Vistra Incorporations API" and OAuth2 client-ID/secret credentials. That
    belongs to Vistra Limited (vistra.com), an unrelated corporate-services, fund
    administration and private-client firm. It is NOT Vistra Corp the Irving,
    Texas power company (vistracorp.com, NYSE: VST). None of that developer
    portal has been attributed to this profile.
  githubNote: >-
    api.github.com/orgs/vistracorp, /orgs/vistra-corp and /orgs/vistraenergy all
    return 404. Two personal user accounts exist (VistraCorp, 0 public repos,
    created 2022-01-14; vistraenergy, 1 public repo, created 2017-06-16), neither
    carrying a name, company or blog field tying them to Vistra Corp. No GitHub
    organization is recorded in apis.yml.

