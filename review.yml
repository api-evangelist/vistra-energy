actions:
  apisYmlCreated: true
  apisListed: 0
  openapiDirCreated: false
  reason: >-
    Identity-only company profile. Vistra Corp is a real, large, strategically
    important US energy company with zero public API surface, so apis[] is
    correctly empty and the value of this record is the negative finding plus the
    structural explanation of why a US competitive retailer has nothing to
    publish.
