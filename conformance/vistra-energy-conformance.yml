method: derived
source: >-
  review.yml probe log + live 2026-07-27 probes of vistracorp.com, txu.com,
  services.txu.com and the five retail-brand domains
scope: >-
  Vistra Corp publishes no machine-readable API contract, so every API-facing
  standard below is asserted false on evidence of absence rather than on a
  negative conformance statement by the company. The energy-sector data
  standards are listed because they are the ones a US competitive generator and
  retail electricity provider would be expected to touch; recording them as not
  found is the point of this artifact.
standards:
- id: openapi
  conforms: false
  evidence: >-
    No OpenAPI or Swagger document found on any Vistra-controlled host.
    /openapi.json and /swagger.json return 404 on vistracorp.com, txu.com,
    dynegy.com, ambitenergy.com, homefieldenergy.com, trieagleenergy.com and
    energyharbor.com; services.txu.com answers every path with the MyAccount
    login HTML (soft 200).
- id: asyncapi
  conforms: false
  evidence: No event, streaming or webhook surface published on any Vistra property.
- id: graphql
  conforms: false
  evidence: No /graphql endpoint found on any Vistra host.
- id: oauth2
  conforms: false
  evidence: >-
    No OAuth 2.0 authorization server. /.well-known/oauth-authorization-server
    returns 404 on vistracorp.com and txu.com. The only authentication surface is
    ASP.NET session-cookie login at services.txu.com.
- id: oidc
  conforms: false
  evidence: >-
    /.well-known/openid-configuration returns 404 on www.vistracorp.com and
